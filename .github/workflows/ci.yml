name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend lint type test eval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.25

      - name: Install backend dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run --locked ruff check .

      - name: Typecheck
        run: MYPYPATH=src uv run --locked mypy

      - name: Test
        run: uv run --locked pytest -m "not live"

      - name: Deterministic release gate
        run: |
          PYTHONPATH=src uv run --locked python -m ask_seoul_agent.eval_cli deterministic \
            --manifest evals/cases.v1.json \
            --output /tmp/deterministic-eval.json

      - name: Upload deterministic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-eval-${{ github.sha }}
          path: /tmp/deterministic-eval.json
          if-no-files-found: ignore

  frontend:
    name: frontend test type build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ask-seoul-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
