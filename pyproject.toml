[project]
name = "ask-seoul-agent"
version = "0.1.0"
description = "Evidence-first LLM tool-calling service over ASK Seoul data products"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "anthropic>=1.0.0,<2.0.0",
  "fastapi>=0.141.0,<0.142.0",
  "google-genai>=1.0.0,<2.0.0",
  "httpx>=0.28.1,<0.29.0",
  "pydantic-settings>=2.12.0,<3.0.0",
  "uvicorn[standard]>=0.40.0,<0.42.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18.0,<2.0.0",
  "pytest>=9.0.0,<10.0.0",
  "pytest-asyncio>=1.2.0,<2.0.0",
  "ruff>=0.13.0,<0.16.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask_seoul_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: opt-in test that calls an external service",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ask_seoul_agent"]
