services:
  ask-seoul-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ask-seoul-agent:local
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENT_PROVIDER: ${AGENT_PROVIDER:-demo}
      AGENT_MAX_CONCURRENT: ${AGENT_MAX_CONCURRENT:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
